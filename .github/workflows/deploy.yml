name: Тесты и публикация демо-версии

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tests:
    name: Автотесты сервера
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  build:
    name: Сборка демо-версии
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE: /${{ github.event.repository.name }}/
      # GitHub Pages отдаёт 404.html для неизвестных адресов — так работают прямые ссылки на страницы приложения
      - run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    name: Публикация на GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
